# Dependabot – kostenlose Dependency-Updates + Security-Alerts (Issue #60).
# Ersetzt zusammen mit codeql.yml den kostenpflichtigen Anthropic-API-Scan.
#
# Kopieren nach .github/dependabot.yml (NICHT nach workflows/ — liegt direkt
# unter .github/). GitHub liest die Datei automatisch, kein Trigger nötig.
#
# package-ecosystem an das Repo anpassen:
#   - Node-Repos:            "npm"  (deckt npm, yarn, pnpm ab)
#   - reine Doc/Config-Repos: nur "github-actions" behalten, "npm"-Block löschen
#
# Drosselung der PR-Flut (Issue #144):
#   - target-branch: "testing" — PRs gegen main sind wegen der Ruleset-Pflicht
#     (PR-Review + Status-Checks) nicht direkt mergebar. MUSS in jedem Repo
#     stehen, sonst landen die PRs auf dem Default-Branch main.
#   - interval: "monthly" statt weekly — ein Schwung pro Monat.
#   - npm: ZWEI Gruppen (vorher ein Block inkl. Major aus #144):
#       npm-minor-patch – Minor/Patch, sollte i. d. R. direkt mergebar sein
#       npm-major       – alle Majors gesammelt, wird einzeln geprüft
#     Grund: Ein einziger inkompatibler Major (typescript 7 vs.
#     typescript-eslint-peer → ERESOLVE; Expo-SDK-Sprung) machte den alten
#     Ein-Block-PR jeden Monat unmergebar, die gefahrlosen Updates blieben
#     mit liegen (Energy_Price_Germany#543, DrawFromMemory#389).
#     Höchstens zwei PRs pro Monat statt einem je Major-Bump.
#   - github-actions: weiter EIN Block inkl. Major (Action-Majors sind selten
#     breaking und kommen nicht gekoppelt).
#   - open-pull-requests-limit: 5 als Sicherheitsnetz gegen Ausreißer.
#
# Expo-/React-Native-Projekte: NICHT diese Datei, sondern dependabot.expo.yml
#   nehmen (gleiche Gruppen + ignore für SDK-gebundene Pakete).
#
# Gekoppelte Toolchains (Issue #173): Blockiert ein Major dauerhaft die
#   npm-major-Gruppe, ihn repo-lokal per ignore aussetzen (Vorlage unten,
#   auskommentiert) und mit Ablaufdatum/Issue-Verweis kommentieren.
#   Sammel-PRs vor dem Merge IMMER lokal prüfen: `npm ci && npm test`.
#
# ACHTUNG: target-branch wirkt nur auf NEUE PRs; bereits offene PRs gegen main
# bleiben stehen und müssen manuell geschlossen oder gemerged werden.
# ACHTUNG: GitHubs Default-Security-Updates ignorieren target-branch. Deshalb
# muss diese Datei auch in Repos liegen, die sonst keine Config bräuchten.

version: 2
updates:
  # GitHub-Actions-Versionen (gilt für ALLE Repos, auch ohne package.json).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "testing"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      # Kein update-types-Filter → Major landet mit im Sammel-PR.
      actions-all:
        patterns:
          - "*"

  # NPM/Yarn/PNPM-Abhängigkeiten (nur Node-Repos; sonst diesen Block entfernen).
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "testing"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # Minor/Patch gesammelt – blockiert nicht mehr durch einen einzelnen Major.
      npm-minor-patch:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      # Majors gesammelt – Breaking Changes stehen im PR-Body, dort prüfen.
      npm-major:
        update-types: ["major"]
        patterns:
          - "*"
    # Gekoppelte Toolchain? Majors einzelner Pakete repo-lokal aussetzen (#173):
    # ignore:
    #   - dependency-name: "typescript"
    #     update-types: ["version-update:semver-major"]
