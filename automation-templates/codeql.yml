name: "CodeQL"

# Kostenlose statische Code-Analyse (SAST) via GitHub CodeQL (Issue #60).
# Ersetzt zusammen mit dependabot.yml den kostenpflichtigen Anthropic-API-Scan.
#
# Wird von scripts/sync-standards.sh nach .github/workflows/codeql.yml kopiert,
# aber nur wenn dort noch keine Fassung liegt (Issue #109).
#
# build-mode: none — CodeQL analysiert den Quellcode direkt. Autobuild schlägt
# bei React-Native-/Expo-Projekten fehl und ist für JS/TS unnötig.
# Die Sprache 'actions' scannt zusätzlich die Workflow-Dateien selbst.
# Für reine Python-/Arduino-Repos ist diese Vorlage wirkungslos — weglassen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, testing]
  schedule:
    # Wöchentlicher Full-Scan: fängt neu bekannt gewordene CVEs ohne Code-Änderung.
    - cron: '30 5 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
