name: CI Quality (React Native)

# Caller-Template für React-Native/Expo-Projekte (Issue #69).
# Ruft reusable-ci-quality.yml@v1 auf — damit wird quality/quality
# als required Status-Check gesetzt und der Merge-Gate geschlossen.
# Anpassen: lint_command / typecheck_command / test_command bei Bedarf überschreiben.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    uses: S540d/project-templates/.github/workflows/reusable-ci-quality.yml@v1
    with:
      node_version: '20'
      run_lint: true
      run_typecheck: true
      run_tests: true
      # lint_command: 'npm run lint'        # Default
      # typecheck_command: 'npm run tsc'    # Expo: ggf. anpassen
      # test_command: 'npm test'            # Default
