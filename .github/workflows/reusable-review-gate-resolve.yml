name: Reusable Review Gate Resolve

# Auflöser für das Merge-Gate "review-gate" (siehe reusable-pr-review.yml).
# Reagiert auf das Setzen/Entfernen des Quittierungs-Labels und setzt denselben
# Commit-Status-Context "review-gate":
#   Label gesetzt   -> success (grün)  -> Merge frei
#   Label entfernt  -> failure (rot)   -> Merge gesperrt
#
# Aufruf versioniert (@v1):
#
#   jobs:
#     resolve:
#       uses: S540d/project-templates/.github/workflows/reusable-review-gate-resolve.yml@v1
#
# Aufrufender Workflow:
#   on:
#     pull_request:
#       types: [labeled, unlabeled]
#   permissions:
#     statuses: write
#     pull-requests: read
#
# Das Label-Setzen überschreibt bewusst einen roten Review-Status: der Mensch hat
# die Findings quittiert. Bei neuem Push entfernt reusable-pr-review.yml das Label
# wieder (synchronize) -> erneute Quittierung nötig.

on:
  workflow_call:
    inputs:
      ack_label:
        description: 'Label, das den Merge freigibt'
        required: false
        type: string
        default: 'suggestions gelesen und verstanden'

permissions:
  statuses: write
  pull-requests: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Set review-gate from label state
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACK_LABEL: ${{ inputs.ack_label }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Ist das Quittierungs-Label aktuell gesetzt?
          if printf '%s' "$LABELS_JSON" | jq -e --arg l "$ACK_LABEL" 'index($l) != null' > /dev/null; then
            STATE="success"
            DESC="Review quittiert ($ACK_LABEL) — Merge freigegeben"
          else
            STATE="failure"
            DESC="Label '$ACK_LABEL' entfernt — Review erneut quittieren"
          fi

          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            --method POST \
            -f state="$STATE" \
            -f context="review-gate" \
            -f description="$DESC"
