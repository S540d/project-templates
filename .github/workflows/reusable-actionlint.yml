name: Reusable Actionlint

# Lintet alle Workflow-Dateien inkl. eingebetteter shell: run:-Blöcke (Issue #122).
# actionlint bringt shellcheck für run:-Blöcke mit — genau das hätte den
# EPG-Vorfall #445 gefangen (ein Apostroph im Fehlertext schloss die Shell-Quotes,
# node bekam --  als Option, Exit 9 in jedem Run, unbemerkt über Stunden).
# Aufruf versioniert (@v2):
#
#   jobs:
#     actionlint:
#       uses: S540d/project-templates/.github/workflows/reusable-actionlint.yml@v2

on:
  workflow_call:
    inputs:
      fail_on_findings:
        description: 'Bei Funden hart fehlschlagen'
        required: false
        type: boolean
        default: true
      templates_ref:
        description: 'Ref von project-templates, aus dem scripts/lint-workflows.js geladen wird'
        required: false
        type: string
        default: 'v2'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail

          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest

          if ./actionlint -color; then
            echo "actionlint: keine Funde."
          elif [ "${{ inputs.fail_on_findings }}" = "true" ]; then
            echo "actionlint: Funde vorhanden, Job schlägt fehl."
            exit 1
          else
            echo "actionlint: Funde vorhanden, aber fail_on_findings=false."
          fi

      - name: Checkout project-templates (lint-workflows.js)
        uses: actions/checkout@v4
        with:
          repository: S540d/project-templates
          ref: ${{ inputs.templates_ref }}
          path: .project-templates
          sparse-checkout: |
            scripts/lint-workflows.js
          sparse-checkout-cone-mode: false

      - name: Guard gegen "node -e" Inline-Blöcke (Issue #445)
        # Fängt die Fehlerklasse, die actionlint/shellcheck nachweislich NICHT
        # findet: ein Apostroph im Body eines mehrzeiligen `node -e '…'`-Blocks
        # ist für die Shell syntaktisch korrekt, nur semantisch falsch.
        run: node .project-templates/scripts/lint-workflows.js
