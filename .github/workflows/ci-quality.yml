name: CI Quality

# Required quality gate: lint + type-check + tests bei jedem PR (Issue #69).
# Schließt die Lücke des vorhandenen reusable-ci-quality.yml, das bisher
# keinen Caller hatte und damit nie automatisch ausgelöst wurde.
# Downstream-Repos nutzen das Caller-Muster aus automation-templates/.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-ci-quality.yml
