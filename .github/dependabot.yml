# Dependabot für project-templates selbst (Issue #60).
# Kein package.json → nur GitHub-Actions-Versionen. Das npm-Ecosystem und CodeQL
# gelten nur für Node-/JS-Repos; die vollständige Vorlage liegt in
# automation-templates/dependabot.yml bzw. automation-templates/codeql.yml.
#
# Drosselung siehe Issue #144 — Begründung in der Vorlage.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "testing"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        patterns:
          - "*"
